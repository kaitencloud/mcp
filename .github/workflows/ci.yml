name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.1"
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Byte-compile
        run: uv run python -m compileall -q server.py

      # The image is what ships, so a broken Dockerfile should fail here rather
      # than on a tag.
      - name: Build image
        run: docker build -t kaiten-mcp:ci .
