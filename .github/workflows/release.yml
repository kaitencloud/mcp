name: Release

on:
  push:
    tags: ["v*"]

# The image is published by ci.yml on the same tag. This publishes the package to PyPI as
# kaitencloud-mcp: the name kaiten-mcp belongs to an unrelated project.
jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing: no API token is stored anywhere.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: The tag names the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi

      - run: uv sync --locked
      - run: uv run pytest

      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv publish --trusted-publishing always
