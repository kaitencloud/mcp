[project]
name = "kaitencloud-mcp"
version = "0.2.0"
description = "Kaiten MCP server: intent-level tools over the Kaiten API for AI agents"
readme = "README.md"
keywords = ["kaiten", "mcp", "model-context-protocol", "ai-agents"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    # Security floors for transitive TLS/JWT dependencies also protect unlocked installs.
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "fastmcp>=4.1.0,<5",
    "httpx>=0.28.0",
    "kaitencloud>=1.0.0",
    "pyjwt>=2.15.0",
    "uvicorn>=0.32.0",
]

# kaitencloud-mcp is the same command under the package's name, so that `uvx kaitencloud-mcp` runs it.
[project.scripts]
kaiten-mcp = "kaiten_mcp.__main__:main"
kaitencloud-mcp = "kaiten_mcp.__main__:main"

[project.urls]
Homepage = "https://kaiten.sh"
Repository = "https://github.com/kaitencloud/mcp"
Issues = "https://github.com/kaitencloud/mcp/issues"
Documentation = "https://docs.kaiten.sh/docs/developer-resources/mcp-server"
Changelog = "https://github.com/kaitencloud/mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaiten_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The e2e suite drives a live Kaiten stack; it only runs when asked for.
addopts = "-m 'not e2e'"
markers = ["e2e: runs against a live Kaiten API (needs KAITEN_API_BASE_URL and KAITEN_API_TOKEN)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
