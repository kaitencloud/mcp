[project]
name = "kaiten-mcp"
version = "0.1.0"
description = "Kaiten MCP Server - Exposes Kaiten API as MCP tools for AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.11.0",
    "httpx>=0.28.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include the server.py file directly (not a package)
include = ["server.py"]

[tool.uv]
# No dev dependencies needed
