[project]
name = "kaiten-mcp"
version = "0.2.0"
description = "Kaiten MCP server: intent-level tools over the Kaiten API for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0,<5",
    "httpx>=0.28.0",
    "kaitencloud>=1.0.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
kaiten-mcp = "kaiten_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaiten_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The e2e suite drives a live Kaiten stack; it only runs when asked for.
addopts = "-m 'not e2e'"
markers = ["e2e: runs against a live Kaiten API (needs KAITEN_API_BASE_URL and KAITEN_API_TOKEN)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
