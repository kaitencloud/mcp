# The MCP server on its own, against a Kaiten you already run.
#
# KAITEN_API_BASE_URL is Kaiten's gateway as seen from inside this container,
# so the default assumes a Kaiten stack on the same machine.
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaiten-mcp
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      KAITEN_API_BASE_URL: ${KAITEN_API_BASE_URL:-http://host.docker.internal:6060/api}
      KAITEN_MCP_READ_ONLY: ${KAITEN_MCP_READ_ONLY:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
